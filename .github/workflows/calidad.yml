name: Calidad y despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: JUnit, JaCoCo y analizadores Maven
        run: mvn -B -ntp clean verify -Pquality,dependency-audit
      - name: Convierte el informe de dependencias
        run: python3 scripts/owasp-to-sonar.py target/dependency-check-report.json target/owasp-sonar.json
      - name: Genera la documentación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen
          doxygen Doxyfile
          test -s target/doxygen/html/index.html
      - name: Analiza en SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::notice::Configura SONAR_TOKEN, SONAR_ORGANIZATION y SONAR_PROJECT_KEY para publicar el análisis."
            exit 0
          fi
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            "-Dsonar.host.url=https://sonarcloud.io" \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            "-Dsonar.externalIssuesReportPaths=target/owasp-sonar.json"
      - name: Guarda los informes y la documentación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-biciam
          path: |
            target/surefire-reports/TEST-*.xml
            target/site/jacoco/
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
            target/dependency-check-report.*
            target/owasp-sonar.json
            target/doxygen/html/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construye y ejecuta BiCIAM
        run: bash scripts/docker-demo.sh
